<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #jogo {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            gap: 25px;
        }

        h1 {
            font-size: 40px;
        }

        #pontos {
            font-size: 28px;
        }

        #botao {
            width: 180px;
            height: 180px;

            border: none;
            border-radius: 50%;

            background: #e63946;
            color: white;

            font-size: 25px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 0 30px #e63946;

            transition: transform 0.1s;
        }

        #botao:active {
            transform: scale(0.9);
        }
    </style>
</head>

<body>

    <div id="jogo">

        <h1>CLIQUE!</h1>

        <div id="pontos">
            Pontos: <span id="contador">0</span>
        </div>

        <button id="botao">
            CLIQUE
        </button>

    </div>

    <!-- Música completamente invisível -->
    <audio
        id="musica"
        src="./Menu.mp3"
        autoplay
        loop
        preload="auto"
        hidden>
    </audio>

    <script>
        const botao = document.getElementById("botao");
        const contador = document.getElementById("contador");
        const musica = document.getElementById("musica");

        let pontos = 0;

        // Volume da música
        musica.volume = 1.0;

        // Tenta tocar automaticamente ao carregar
        window.addEventListener("load", function () {
            musica.play().catch(function () {
                console.log("O navegador bloqueou o autoplay.");
            });
        });

        // Tenta novamente quando a página voltar a ficar visível
        document.addEventListener("visibilitychange", function () {
            if (!document.hidden && musica.paused) {
                musica.play().catch(function () {});
            }
        });

        // Sistema de pontos
        botao.addEventListener("click", function () {
            pontos++;
            contador.textContent = pontos;

            botao.style.transform = "scale(0.9)";

            setTimeout(function () {
                botao.style.transform = "scale(1)";
            }, 100);
        });
    </script>

</body>
</html>
