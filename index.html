<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Tela inicial */
        #inicio {
            position: fixed;
            inset: 0;
            z-index: 1000;

            background: #111;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            gap: 25px;

            text-align: center;
        }

        #inicio h1 {
            font-size: 42px;
        }

        #comecar {
            padding: 18px 35px;

            border: none;
            border-radius: 10px;

            background: #e63946;
            color: white;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;
        }

        #comecar:active {
            transform: scale(0.95);
        }

        /* Jogo */
        #jogo {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 25px;
        }

        h2 {
            font-size: 40px;
        }

        #pontos {
            font-size: 28px;
        }

        #botao {
            width: 180px;
            height: 180px;

            border: none;
            border-radius: 50%;

            background: #e63946;
            color: white;

            font-size: 25px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 0 30px #e63946;

            transition: transform 0.1s;
        }

        #botao:active {
            transform: scale(0.9);
        }

        /* Esconde o jogo até começar */
        #jogo {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Tela inicial -->
    <div id="inicio">

        <h1>MEU JOGO</h1>

        <button id="comecar">
            TOQUE PARA COMEÇAR
        </button>

    </div>


    <!-- Jogo -->
    <div id="jogo">

        <h2>CLIQUE!</h2>

        <div id="pontos">
            Pontos: <span id="contador">0</span>
        </div>

        <button id="botao">
            CLIQUE
        </button>

    </div>


    <!-- Música invisível -->
    <audio
        id="musica"
        src="./Menu.mp3"
        loop
        preload="auto"
        hidden>
    </audio>


    <script>

        const inicio = document.getElementById("inicio");
        const comecar = document.getElementById("comecar");

        const jogo = document.getElementById("jogo");

        const musica = document.getElementById("musica");

        const botao = document.getElementById("botao");
        const contador = document.getElementById("contador");

        let pontos = 0;


        /*
         * COMEÇAR O JOGO
         */
        comecar.addEventListener("click", async function () {

            try {

                // Começa a música
                musica.volume = 1.0;

                await musica.play();

                // Esconde a tela inicial
                inicio.style.display = "none";

                // Mostra o jogo
                jogo.style.display = "flex";

            } catch (erro) {

                console.log("Não foi possível iniciar a música:", erro);

            }

        });


        /*
         * SISTEMA DE PONTOS
         */
        botao.addEventListener("click", function () {

            pontos++;

            contador.textContent = pontos;

            botao.style.transform = "scale(0.9)";

            setTimeout(function () {

                botao.style.transform = "scale(1)";

            }, 100);

        });

    </script>

</body>

</html>
